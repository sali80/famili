<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080A0D">
  <title>FamiLi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 18px;
      min-height: 100vh;
      background: #080A0D;
      color: #FFFFFF;
      font-family: system-ui, -apple-system, "Segoe UI",
                   sans-serif;
    }

    main {
      max-width: 440px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 28px 0 32px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 750;
      letter-spacing: -2px;
    }

    .subtitle {
      margin-top: 8px;
      color: #AAB4C3;
      font-size: 12px;
      letter-spacing: 3px;
    }

    .accent {
      width: 36px;
      height: 3px;
      margin: 20px auto 0;
      border-radius: 3px;
      background: #7892AE;
    }

    section {
      margin-bottom: 26px;
    }

    h2 {
      margin: 0 0 10px 2px;
      color: #91A7C0;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 1.5px;
      /* text-transform: uppercase; */
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      margin-bottom: 9px;
      padding: 17px 18px;
      border: 1px solid #2B3745;
      border-radius: 13px;
      background: #202B38;
      color: #FFFFFF;
      text-decoration: none;
      transition: background 160ms ease,
                  border-color 160ms ease,
                  transform 160ms ease;
    }

    .link:hover {
      background: #2B3A4B;
      border-color: #526B85;
      transform: translateY(-1px);
    }

    .link:focus-visible {
      outline: 2px solid #A9C8E8;
      outline-offset: 3px;
    }

    .symbol {
      width: 25px;
      flex-shrink: 0;
      color: #B6C8DA;
      font-size: 22px;
      text-align: center;
    }

    .details {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .label {
      font-size: 15px;
      font-weight: 550;
      line-height: 1.5;
    }

    .hint {
      margin-top: 3px;
      color: #B6C0CD;
      font-size: 12px;
    }

    .arrow {
      color: #B6C8DA;
      font-size: 19px;
    }

    footer {
      padding: 12px 0;
      color: #637080;
      font-size: 12px;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .link {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>FamiLi</h1>
      <!-- div class="accent"></div -->
    </header>

    <section>
      <!-- h2>Familie</h2 -->

      <a class="link"
         id="addressLink"
         target="_blank"
         href="https://www.google.com/maps/search/?api=1&amp;query=Neue+Stra%C3%9Fe+67%2F1%2C+73732+Esslingen">
        <span class="symbol" aria-hidden="true">⌖</span>
        <span class="details">
          <span class="label">Neue Straße 67/1 · 73732 Esslingen</span>
          <span class="hint" style="display:block">
            Adresse
          </span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="tel:+4971191455811">
        <span class="symbol" aria-hidden="true">☎</span>
        <span class="details">
          <span class="label">0711 91455811</span>
          <span class="hint" style="display:block">
            Telefon
          </span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </section>

    <section>
      <h2>Sascha</h2>

      <a class="link"
         href="mailto:s.linnenbrink@outlook.de">
        <span class="symbol" aria-hidden="true">✉</span>
        <span class="details">
          <span class="label">
            s.linnenbrink@outlook.de
          </span>
          <span class="hint" style="display:block">
            E-Mail schreiben
          </span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="tel:+4917610555117">
        <span class="symbol" aria-hidden="true">▯</span>
        <span class="details">
          <span class="label">0176 10555117</span>
          <span class="hint" style="display:block">
            Mobiltelefon
          </span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </section>

    <section>
      <h2>Amelie</h2>

      <a class="link"
         href="mailto:am.linnenbrink@outlook.de">
        <span class="symbol" aria-hidden="true">✉</span>
        <span class="details">
          <span class="label">
            am.linnenbrink@outlook.de
          </span>
          <span class="hint" style="display:block">
            E-Mail schreiben
          </span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="tel:+4917670111175">
        <span class="symbol" aria-hidden="true">▯</span>
        <span class="details">
          <span class="label">0176 70111175</span>
          <span class="hint" style="display:block">
            Mobiltelefon
          </span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </section>

    <footer></footer>
  </main>

  <script>
    // Adresse für alle Karten-Apps
    const address = "Neue Straße 67/1, 73732 Esslingen";
    const lat = "48.7435";
    const lon = "9.3102";

    // Adress-Link finden
    const addressLink = document.getElementById("addressLink");

    // Betriebssystem erkennen
    const ua = navigator.userAgent;

    const isIOS =
      /iPhone|iPad|iPod/.test(ua) ||
      (navigator.platform === "MacIntel" &&
       navigator.maxTouchPoints > 1);

    const isAndroid = /Android/i.test(ua);

    // Je nach Gerät das passende Kartenziel setzen
    if (isIOS) {
      // iPhone und iPad: Apple Karten
      addressLink.href =
        "https://maps.apple.com/?q=" +
        encodeURIComponent(address);

    } else if (isAndroid) {
      // Android: Google Maps App (geo: URI scheme)
      addressLink.href =
        "geo:" + lat + "," + lon + "?q=" +
        encodeURIComponent(address);

    } else {
      // Windows, Mac und andere Geräte: Google Maps im Browser
      addressLink.href =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(address);
    }
  </script>
</body>
</html>
